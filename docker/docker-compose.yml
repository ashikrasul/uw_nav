# Run from this folder:  docker compose up -d   |   ./enter_console.sh [service]
# ROS 2 needs no master: services find each other over DDS on the host network.
# Add future ROS 2 services with `<<: *ros` and `environment: {<<: *ros-env, ...}`.

x-ros: &ros
  network_mode: host
  privileged: true           # serial and I2C access
  restart: unless-stopped    # back up after a crash or reboot
  logging:
    options:
      max-size: "10m"
      max-file: "3"

x-ros-env: &ros-env           # taken from the host shell so host and containers match
  ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
  ROS_LOCALHOST_ONLY: ${ROS_LOCALHOST_ONLY:-0}

services:
  nav:
    <<: *ros
    container_name: nav
    image: ros_nav_ws:humble
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      <<: *ros-env
      SERVICE_NAME: nav
    volumes:
      - ../src:/ros2_ws/src
      - ../utils:/ros2_ws/utils:ro
      - /dev:/dev            # re-plugged USB serial devices show up inside the container
    group_add:   # host i2c and gpio groups (Jetson.GPIO needs /dev/gpiochip0 on import)
      - "${I2C_GID:?create docker/.env with I2C_GID, see readme}"
      - "${GPIO_GID:?create docker/.env with GPIO_GID, see readme}"

  # Records every topic of each run to ~/nav_logs/nav_<date>_<time>/ (rosbag2, MCAP, zstd-compressed chunks;
  # Foxglove and ros2 bag play read it directly).
  # A new bag starts each time the service starts (compose up, reboot); stop with `docker compose stop record`.
  record:
    <<: *ros
    container_name: nav_record
    image: ros_nav_ws:humble
    environment:
      <<: *ros-env
      SERVICE_NAME: record
    volumes:
      - ${HOME}/nav_logs:/logs   # create it first (mkdir -p ~/nav_logs), else Docker makes it root-owned
      - /dev/shm:/dev/shm        # same Fast DDS shared memory as the nav service
    entrypoint: ["bash", "-c"]
    command: ["source /opt/ros/humble/setup.bash && exec ros2 bag record -a -s mcap --storage-preset-profile zstd_fast -o /logs/nav_$$(date +%Y%m%d_%H%M%S)"]
    stop_signal: SIGINT          # lets rosbag2 close the file cleanly
    stop_grace_period: 15s
